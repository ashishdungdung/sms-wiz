[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sms-wiz"
version = "0.1.0"
description = "India-first SMS organiser: rule-first classification, zero double counting, iOS-aware routing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "httpx>=0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
sms-wiz = "sms_wiz.cli:main"

[tool.setuptools.packages.find]
include = ["sms_wiz*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
