name: SMSWiz
options:
  bundleIdPrefix: com.example.smswiz
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  SMSCore:
    path: Packages/SMSCore

targets:
  SMSWiz:
    type: application
    platform: iOS
    sources:
      - path: SMSWiz
        excludes:
          - ShareViewController.swift
          - Info.plist
          - SMSWiz.entitlements
    info:
      path: SMSWiz/Info.plist
    entitlements:
      path: SMSWiz/SMSWiz.entitlements
    dependencies:
      - package: SMSCore
      - target: MessageFilterExtension
      - target: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.smswiz
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  MessageFilterExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: MessageFilterExtension
        excludes:
          - Info.plist
          - MessageFilterExtension.entitlements
      - path: ../contracts/filter_rules.json
        buildPhase: resources
      - path: ../contracts/sender_kinds.json
        buildPhase: resources
    info:
      path: MessageFilterExtension/Info.plist
    entitlements:
      path: MessageFilterExtension/MessageFilterExtension.entitlements
    dependencies:
      - package: SMSCore
      - sdk: IdentityLookup.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.smswiz.MessageFilterExtension
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SMSWiz/ShareViewController.swift
    info:
      path: ShareExtension/Info.plist
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
    dependencies:
      - package: SMSCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.smswiz.ShareExtension
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
