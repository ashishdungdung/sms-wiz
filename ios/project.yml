name: SMSWiz
options:
  bundleIdPrefix: com.ashishdungdung.smswiz
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    DEVELOPMENT_TEAM: 5ZE5DE96PN
    CODE_SIGN_STYLE: Automatic

packages:
  SMSCore:
    path: Packages/SMSCore

targets:
  SMSWiz:
    type: application
    platform: iOS
    sources:
      - path: SMSWiz
        excludes:
          - ShareViewController.swift
          - Info.plist
          - SMSWiz.entitlements
    entitlements:
      path: SMSWiz/SMSWiz.entitlements
    dependencies:
      - package: SMSCore
      - target: MessageFilterExtension
      - target: ShareExtension
    settings:
      base:
        INFOPLIST_FILE: SMSWiz/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.ashishdungdung.smswiz
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  MessageFilterExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: MessageFilterExtension
        excludes:
          - Info.plist
          - MessageFilterExtension.entitlements
      - path: ../contracts/filter_rules.json
        buildPhase: resources
      - path: ../contracts/sender_kinds.json
        buildPhase: resources
    entitlements:
      path: MessageFilterExtension/MessageFilterExtension.entitlements
    dependencies:
      - package: SMSCore
      - sdk: IdentityLookup.framework
    settings:
      base:
        INFOPLIST_FILE: MessageFilterExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ashishdungdung.smswiz.MessageFilterExtension
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SMSWiz/ShareViewController.swift
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
    dependencies:
      - package: SMSCore
    settings:
      base:
        INFOPLIST_FILE: ShareExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ashishdungdung.smswiz.ShareExtension
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
